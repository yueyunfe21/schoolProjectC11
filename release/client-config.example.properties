# Copy to config/application.properties INSIDE the extracted client directory.
# Gamma and Prod connection settings are external; never rebuild a tested binary to change channel.
# Supply the operator-approved endpoint. No private server/GitHub credentials belong in this file.
cloud.turn.base-uri=https://YOUR-CLOUD-HOST
cloud.turn.sidecar.auto-start-enabled=false
bot.run.auto-start=false
bot.run.show-ui=true
# The current transport requires a nonblank user-specific token; provision it through authorized setup.
# Never distribute the developer's shared local token.
cloud.turn.bearer-token=YOUR-USER-TOKEN
# Copy the exact client UUID and token provisioned by the operator; do not invent a binding.
cloud.turn.device-id=YOUR-CLIENT-UUID
