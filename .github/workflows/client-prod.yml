name: 客户端 Prod 发布

on:
  workflow_dispatch:
    inputs:
      publish_production_package:
        description: '将此包晋级到 Prod（R2 授权分发，并在 GitHub Release 归档）'
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: '已验收 Gamma 包的运行编号（不是版本号）'
        required: true
        type: string
      candidate_run_attempt:
        description: 'Gamma 运行的尝试编号'
        required: true
        default: '1'
        type: string
      gamma_accepted:
        description: '我确认已人工验收这一个候选包'
        required: true
        default: false
        type: boolean
      update_mode:
        description: '更新策略（required仅可准备，运行中禁版验收前禁止正式发布）'
        required: true
        default: optional
        type: choice
        options: [optional, required]
      release_notes:
        description: '用户可见的更新说明'
        required: true
        type: string
      expected_policy_revision:
        description: '当前授权政策 revision（首次为0；不一致则停止，防止覆盖其它修改）'
        required: true
        default: '0'
        type: string
      production_confirmation:
        description: '输入 PUBLISH-ACCEPTED-GAMMA 确认晋级 exact Gamma'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Never abort a promotion half way through it, or let two promotions race the production pointer.
concurrency:
  group: client-production-promotion
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    outputs:
      artifact_id: ${{ steps.prepared.outputs.artifact-id }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Promotion code is from the dispatch/default branch, never from the selected candidate zip.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 核对 Gamma 来源与人工确认
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          GAMMA_ACCEPTED: ${{ inputs.gamma_accepted }}
        run: ./scripts/release/prepare-promotion.ps1 -Phase Source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: 校验同一包并生成晋级申请（不重新构建）
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GAMMA_ACCEPTED: ${{ inputs.gamma_accepted }}
          UPDATE_MODE: ${{ inputs.update_mode }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ./scripts/release/prepare-promotion.ps1 -Phase Package -CandidateDirectory "$env:RUNNER_TEMP/candidate" -OutputDirectory "$env:RUNNER_TEMP/promotion"
      - name: 保留待发布申请及原包
        id: prepared
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-prod-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: 显示准备阶段边界
        run: |
          @"
          ## Prod 发布准备完成，未正式发布
          已核对原始 Gamma 包及 SHA256，保留原包，没有重新编译。
          本阶段仅生成发布申请。确认正式晋级后，publish 作业才会上传私有 R2 并创建 GitHub 归档 Release。
          未勾选时不创建正式 Release、不更新 latest、不禁用旧版。
          本阶段不激活版本公告；完整升级仍须由实际客户端验收，不能由准备成功代替。
          "@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Warning 'PREPARED_ONLY: no production release or update notification was activated.'

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/master' && github.actor == 'yueyunfe21' && inputs.publish_production_package && inputs.production_confirmation == 'PUBLISH-ACCEPTED-GAMMA'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/promotion
      - name: 上传私有 R2、归档 Release 并公告推荐版（不改变禁版规则）
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PACKAGE_APPROVED: ${{ inputs.publish_production_package }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          CLIENT_POLICY_API_TOKEN: ${{ secrets.CLIENT_POLICY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: dhxy-client-updates
          EXPECTED_POLICY_REVISION: ${{ inputs.expected_policy_revision }}
        run: ./scripts/release/publish-client.ps1 -PromotionDirectory "$env:RUNNER_TEMP/promotion"
