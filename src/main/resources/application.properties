# ==============================
# 任务队列配置
# ==============================

# 当前没有 UI，先通过配置控制启动后执行哪些任务。
# 多个任务用英文逗号分隔，例如：bot.run.tasks=wuhuan,zhuagui,xiuluo
bot.run.tasks=wuhuan

# 是否循环执行任务队列。
bot.run.loop=false

# 测试模式：只验证任务注册与队列调度，不真正执行任务逻辑。
bot.run.test-mode=false

# 是否在启动任务前初始化游戏窗口。
# 正式运行保持 true；只测试任务队列或后续 UI 时可以临时改为 false。
bot.run.init-game-window=true

# 是否显示 JavaFX 主界面。
bot.run.show-ui=true

# 是否启动后自动执行配置里的任务。
# show-ui=true 时建议 false，让用户从界面点击开始。
bot.run.auto-start=false

# ==============================
# 多窗口隔离配置
# ==============================

# 多窗口隔离总开关。
bot.window.isolation-enabled=true

# 输入前根据当前 WindowTaskRunner 绑定的 hwnd 激活窗口。
bot.window.input-focus-enabled=true

# GameClientTracker 按窗口任务线程隔离 gameHwnd / windowBaseX / windowBaseY。
bot.window.tracker-state-isolation-enabled=true

# GameClientTracker 优先使用当前窗口绑定的 native hwnd，不再按标题搜索第一个窗口。
bot.window.bound-window-tracker-enabled=true

# 暂时保持关闭，否则旧识别代码可能读不到 images/temp 下的截图。
bot.window.scoped-temp-path-enabled=false
