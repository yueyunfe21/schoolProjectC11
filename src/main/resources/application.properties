# ==============================
# \u4EFB\u52A1\u961F\u5217\u914D\u7F6E
# ==============================

# \u5F53\u524D\u6CA1\u6709 UI\uFF0C\u5148\u901A\u8FC7\u914D\u7F6E\u63A7\u5236\u542F\u52A8\u540E\u6267\u884C\u54EA\u4E9B\u4EFB\u52A1\u3002
# \u591A\u4E2A\u4EFB\u52A1\u7528\u82F1\u6587\u9017\u53F7\u5206\u9694\uFF0C\u4F8B\u5982\uFF1Abot.run.tasks=wuhuan_v2,wubei,xiuluo_v2
bot.run.tasks=wuhuan_v2

# \u662F\u5426\u5FAA\u73AF\u6267\u884C\u4EFB\u52A1\u961F\u5217\u3002
bot.run.loop=false

# \u6D4B\u8BD5\u6A21\u5F0F\uFF1A\u53EA\u9A8C\u8BC1\u4EFB\u52A1\u6CE8\u518C\u4E0E\u961F\u5217\u8C03\u5EA6\uFF0C\u4E0D\u771F\u6B63\u6267\u884C\u4EFB\u52A1\u903B\u8F91\u3002
bot.run.test-mode=false

# \u662F\u5426\u5728\u542F\u52A8\u4EFB\u52A1\u524D\u521D\u59CB\u5316\u6E38\u620F\u7A97\u53E3\u3002
# \u6B63\u5F0F\u8FD0\u884C\u4FDD\u6301 true\uFF1B\u53EA\u6D4B\u8BD5\u4EFB\u52A1\u961F\u5217\u6216\u540E\u7EED UI \u65F6\u53EF\u4EE5\u4E34\u65F6\u6539\u4E3A false\u3002
bot.run.init-game-window=true

# \u662F\u5426\u663E\u793A JavaFX \u4E3B\u754C\u9762\u3002
bot.run.show-ui=true

# \u662F\u5426\u542F\u52A8\u540E\u81EA\u52A8\u6267\u884C\u914D\u7F6E\u91CC\u7684\u4EFB\u52A1\u3002
# show-ui=true \u65F6\u5EFA\u8BAE false\uFF0C\u8BA9\u7528\u6237\u4ECE\u754C\u9762\u70B9\u51FB\u5F00\u59CB\u3002
bot.run.auto-start=false

# ==============================
# License worker
# ==============================
license.worker.base-url=https://dhxy-license-worker.yueyunfe.workers.dev
license.worker.app-id=dhxy
license.worker.app-version=0.0.1

# Diagnostic case upload is opt-in. Set endpoint/token only after the case Worker is deployed.
case.upload.enabled=false
case.upload.endpoint=
case.upload.token=
case.upload.connect-timeout-ms=3000
case.upload.read-timeout-ms=8000
case.upload.max-attempts=3
case.upload.retry-delay-ms=60000

# ==============================
# HTTPS turn transport (inert until an explicit TURN-40 start)
# ==============================
cloud.turn.base-uri=http://127.0.0.1:18080
cloud.turn.bearer-token=local-dev-token
cloud.turn.device-id=dhxy-client
cloud.turn.connect-timeout-ms=3000
cloud.turn.request-timeout-ms=65000
cloud.turn.long-wait-timeout-ms=60000
cloud.turn.template-root=images/template
cloud.turn.sidecar.auto-start-enabled=true
cloud.turn.sidecar.script-path=scripts/run-cloud-brain-server.ps1
# \u7559\u7A7A = \u6309\u5BA2\u6237\u7AEF\u9879\u76EE\u6839\u7684\u540C\u7EA7 dhxy-cloud-brain \u63A8\u5BFC\uFF08\u6362\u673A\u4E0D\u7528\u6539 Git \u8DDF\u8E2A\u7684\u6587\u4EF6\uFF09\u3002
# \u4ED3\u5E93\u4E0D\u5728\u540C\u7EA7\u65F6\uFF0C\u5728 config/application.properties\uFF08\u672C\u673A\u4E13\u5C5E\uFF0C\u4E0D\u5165 Git\uFF09\u91CC\u8986\u76D6\u672C\u952E\uFF0C
# \u6216\u8BBE\u73AF\u5883\u53D8\u91CF DHXY_CLOUD_BRAIN_ROOT\u3002\u6A21\u677F\u89C1 config/application.properties.example\u3002
cloud.turn.sidecar.brain-project-path=
cloud.turn.sidecar.log-path=logs/cloud-decision-dev-sidecar.log
cloud.turn.sidecar.tenant-id=dhxy-local
cloud.turn.sidecar.ocr-port=18762
cloud.turn.sidecar.startup-timeout-ms=120000

# G041 input backend. This machine passed the signed-driver and application-level readiness gates.
# FAKER_INPUT must fail closed when its virtual HID driver is missing or incompatible.
# \u8FD9\u4E00\u884C\u968F\u673A\u5668\u800C\u53D8\uFF1A\u65B0\u673A\u5668\u6CA1\u88C5\u9A71\u52A8\u65F6\uFF0C\u5728 config/application.properties \u91CC\u6539\u6210 SEND_INPUT\uFF0C
# \u4E0D\u8981\u6539\u672C\u6587\u4EF6\u3002
bot.input.backend=FAKER_INPUT
bot.input.faker-input-required-api-version=1

# ==============================
# \u6E38\u620F\u5185\u4EFB\u52A1\u6B21\u6570\u914D\u7F6E\uFF1BUI \u8BBE\u7F6E\u9875\u4F1A\u5C55\u793A\u8FD9\u4E9B\u503C
# \u5F53\u524D\u5DF2\u63A5\u5165\u7684\u4EFB\u52A1\u4F1A\u76F4\u63A5\u8BFB\u53D6\u5BF9\u5E94\u5B57\u6BB5\uFF1B\u672A\u63A5\u5165\u7684\u4EFB\u52A1\u5148\u4FDD\u7559\u914D\u7F6E\u5165\u53E3\uFF0C\u540E\u7EED\u4E1A\u52A1\u5B9E\u73B0\u590D\u7528\u3002
# max-runs <= 0 \u8868\u793A\u4E00\u76F4\u8DD1\u5230\u624B\u52A8\u505C\u6B62\uFF1BUI \u5F53\u524D\u4F1A\u89C4\u6574\u4E3A\u81F3\u5C11 1 \u6B21\uFF0C\u907F\u514D\u8BEF\u89E6\u65E0\u9650\u5FAA\u73AF\u3002
# \u4E94\u73AF UI \u53EA\u5141\u8BB8 1 \u6216 2 \u6B21\uFF0C\u907F\u514D\u8D85\u8FC7\u6E38\u620F\u65E5\u5E38\u9650\u5236\u5BFC\u81F4\u4EFB\u52A1\u72B6\u6001\u5F02\u5E38\u3002
bot.dhxy.wuhuan-max-runs=1
bot.dhxy.fivefold-max-runs=1

# \u4FEE\u7F57\u7B2C\u4E00\u7248\u914D\u7F6E\uFF1BUI \u8BBE\u7F6E\u9875\u4F1A\u5C55\u793A xiuluo-max-runs
# xiuluo-max-runs <= 0 \u8868\u793A\u4E00\u76F4\u8DD1\u5230\u624B\u52A8\u505C\u6B62
bot.dhxy.xiuluo-max-runs=1
bot.dhxy.xiuluo-maintenance-run-immediately-on-start=false

# \u53EC\u5524\u517D\u4E09\u6280\u80FD\u7EF4\u62A4\uFF1BUI \u8BBE\u7F6E\u9875\u7528\u5206\u949F\u5C55\u793A\uFF0C\u540E\u7AEF\u4FDD\u7559\u6BEB\u79D2\u914D\u7F6E\u3002
bot.dhxy.summon-skill-clean-enabled=true
bot.dhxy.summon-skill-clean-interval-ms=1200000

# \u4EFB\u52A1\u542F\u52A8\u524D\u7F6E\u68C0\u67E5\u4F1A\u786E\u8BA4\u5C0F\u5730\u56FE\u8FFD\u8E2A\u3001Alt+U \u5C55\u5F00\u72B6\u6001\u548C Alt+6 \u5C4F\u853D\u73A9\u5BB6\u540D\u3002
# \u4E34\u65F6\u5173\u95ED\uFF0C\u4FBF\u4E8E\u5F53\u524D\u65B0\u624B\u6D41\u7A0B fresh-run \u8C03\u8BD5\uFF1B\u9700\u8981\u6062\u590D\u5B8C\u6574\u4EFB\u52A1\u542F\u52A8\u51C6\u5907\u65F6\u518D\u5F00\u542F\u3002
bot.dhxy.task-startup-preparation-enabled=false

# ==============================
# Team return maintenance
# ==============================
# Leader windows do not click the return-team button. If the signal is visible,
# they wait here so member windows have time to return before the leader continues.


# \u591A\u7A97\u53E3\u9694\u79BB\u603B\u5F00\u5173\u3002
bot.window.isolation-enabled=true

# \u8F93\u5165\u524D\u6839\u636E\u5F53\u524D WindowTaskRunner \u7ED1\u5B9A\u7684 hwnd \u6FC0\u6D3B\u7A97\u53E3\u3002
bot.window.input-focus-enabled=true

# GameClientTracker \u6309\u7A97\u53E3\u4EFB\u52A1\u7EBF\u7A0B\u9694\u79BB gameHwnd / windowBaseX / windowBaseY\u3002
bot.window.tracker-state-isolation-enabled=true

# GameClientTracker \u4F18\u5148\u4F7F\u7528\u5F53\u524D\u7A97\u53E3\u7ED1\u5B9A\u7684 native hwnd\uFF0C\u4E0D\u518D\u6309\u6807\u9898\u641C\u7D22\u7B2C\u4E00\u4E2A\u7A97\u53E3\u3002
bot.window.bound-window-tracker-enabled=true

# \u591A\u7A97\u53E3\u4EFB\u52A1\u622A\u56FE\u6309 windowId \u5206\u76EE\u5F55\uFF0C\u907F\u514D\u5E76\u53D1 OCR/\u6A21\u677F\u622A\u56FE\u4E92\u76F8\u8986\u76D6\u3002
bot.window.scoped-temp-path-enabled=true

# \u7ED1\u5B9A\u7A97\u53E3\u4E0A\u4E0B\u6587\u4E2D\u4F18\u5148\u4F7F\u7528 HWND \u540E\u53F0\u622A\u56FE\u3002
# 2026-05-22 \u5B9E\u9A8C\u786E\u8BA4\uFF1A\u6E38\u620F\u7A97\u53E3\u88AB\u6D4F\u89C8\u5668/IDE/\u5176\u4ED6\u6E38\u620F\u7A97\u53E3\u906E\u6321\u65F6\u4ECD\u53EF\u622A\u5230\u672C HWND \u753B\u9762\u3002
bot.window.hwnd-capture-enabled=true

# HWND \u622A\u56FE\u5931\u8D25\u65F6\u5FC5\u987B fail-closed\uFF0C\u7981\u6B62 focus \u540E\u9000\u56DE Robot \u53EF\u89C1\u5C4F\u5E55\u622A\u56FE\u3002
bot.window.hwnd-capture-fallback-to-robot-enabled=false

# \u5141\u8BB8\u5DF2\u9A8C\u8BC1\u7684\u952E\u76D8\u5FEB\u6377\u952E\u901A\u8FC7 HWND \u540E\u53F0\u6D88\u606F\u53D1\u9001\u3002
# \u6240\u6709\u5FEB\u6377\u952E\u3001Ctrl\u3001Enter \u548C Unicode \u6587\u672C\u53EA\u8D70\u7CBE\u786E HWND \u540E\u53F0\u6D88\u606F\uFF0C\u5931\u8D25\u4E0D\u56DE\u9000\u524D\u53F0\u952E\u76D8\u3002
bot.window.hwnd-keyboard-enabled=true

# UI version label. The mock update checker was removed from the release tree.
bot.app-version=0.1.0-dev
bot.xiuluo.local-kanda-enabled=true
